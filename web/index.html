<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krita preview</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<button id="settings-toggle" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-controls="page-settings" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10.402 2.94 L13.598 2.94 L13.76 5.432 L16.808 7.192 L19.048 6.086 L20.645 8.853 L18.568 10.24 L18.568 13.76 L20.645 15.147 L19.048 17.914 L16.808 16.808 L13.76 18.568 L13.598 21.06 L10.402 21.06 L10.24 18.568 L7.192 16.808 L4.952 17.914 L3.355 15.147 L5.432 13.76 L5.432 10.24 L3.355 8.853 L4.952 6.086 L7.192 7.192 L10.24 5.432 Z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
<dialog class="page-dialog" id="page-settings" aria-labelledby="settings-title">
  <div class="dialog-heading"><h2 class="dialog-title" id="settings-title">Settings</h2><button class="dialog-close" id="settings-close" type="button" aria-label="Close" title="Close">×</button></div>
  <div id="language-bar" hidden><label id="language-label" for="language">Language</label><select id="language" autofocus></select><button id="apply-language" disabled>Apply</button></div>
  <div id="widget-style-row"><label id="widget-style-label" for="widget-style">Widget style</label><select id="widget-style" disabled></select></div>
  <div id="appearance-row"><label id="appearance-label" for="appearance">Appearance</label><select id="appearance"><option value="auto">Follow browser</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
  <div class="corner-row"><label id="window-radius-label" for="window-radius">Window corners</label><input id="window-radius" type="range" min="0" max="24" step="1" value="8"><output for="window-radius">8px</output></div>
  <div class="corner-row" id="control-radius-row"><label id="control-radius-label" for="control-radius">Control corners</label><input id="control-radius" type="range" min="0" max="12" step="1" value="4"><output for="control-radius">4px</output></div>
  <button id="bundle-replace" hidden>Load another bundle</button>
</dialog>
<dialog class="page-dialog" id="file-open" aria-labelledby="file-title" aria-describedby="file-source">
  <div class="dialog-heading"><h2 class="dialog-title" id="file-title"></h2><button class="dialog-close" id="file-close" type="button">×</button></div>
  <p id="file-source"></p>
  <section aria-labelledby="cache-title"><h3 id="cache-title"></h3><button id="file-cache" type="button"></button></section>
  <section aria-labelledby="device-title"><h3 id="device-title"></h3>
    <div class="file-drop" id="device-drop"><label id="device-choose" for="device-file"></label> <input id="device-file" type="file"></div>
    <p class="file-error" id="device-error" role="alert"></p>
  </section>
</dialog>
<div id="status" role="status">Preparing Krita…</div>
<details id="failure" hidden><summary>Error details</summary><pre id="failure-stack"></pre></details>
<section id="bundle-panel" hidden>
  <h1>Krita</h1>
  <p id="bundle-prompt"></p>
  <p><a id="bundle-release" target="_blank" rel="noopener"></a></p>
  <div class="file-drop" id="bundle-drop"><label id="bundle-choose" for="bundle-file"></label> <input id="bundle-file" type="file" accept=".gz,.tgz,application/gzip"></div>
  <p class="file-error" id="bundle-error" role="alert"></p>
  <p id="bundle-cache"></p>
</section>
<div id="recovery-error" role="alert" hidden></div>
<div id="screen"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
