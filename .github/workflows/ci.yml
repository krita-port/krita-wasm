name: Build Krita Wasm
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check C++ formatting
        run: scripts/format.sh --check

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Check Python
        run: |
          python -m pip install --cache-dir cache/pip -r requirements.txt
          ruff format --check scripts tests
          ruff check scripts tests
          mypy
          python -m unittest discover -s tests -v

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.5'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Check TypeScript and loader logic
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --store-dir cache/pnpm
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Get emscripten version
        run: |
          echo "EMSCRIPTEN_VERSION=$(cat .emscripten-version)" >> "$GITHUB_ENV"

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Prepare pinned sources and prebuilt dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git submodule update --init --depth 1 krita
          python scripts/sdk.py fetch
          python scripts/fetch-fonts.py
          python scripts/project.py prepare-source

      - name: Build and package
        run: |
          python scripts/offline-exec.py scripts/package-krita.py --output dist/krita \
            --release-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/latest"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krita-wasm-${{ github.sha }}
          path: |
            dist/krita/krita.bundle.tar.gz
            dist/krita/krita.pages.tar.gz
            dist/krita/build.json
          compression-level: 0
          if-no-files-found: error

      - name: Verify distributed Wasm and frozen SDK inventories
        run: |
          tar -xOf dist/krita/krita.bundle.tar.gz krita.wasm > build/check.wasm
          sdk_environment=$(python scripts/sdk.py environment)
          eval "$sdk_environment"
          scripts/with-emsdk python scripts/check-wasm-exceptions.py build/check.wasm --report build/wasm-exceptions.json
          python scripts/offline-exec.py scripts/sdk.py verify

      - name: Verify independently compiled catalogs
        run: |
          python scripts/verify-krita-catalogs.py dist/krita/krita.bundle.tar.gz --report build/catalogs.json

      - name: Install browser runtime libraries
        run: |
          sudo apt update
          if report=$(pnpm exec playwright install-deps --dry-run chromium firefox webkit 2>&1); then
            printf '%s\n' "$report"
          else
            printf '%s\n' "$report"
            mapfile -t packages < <(printf '%s\n' "$report" | sed -n 's/^  \([a-z0-9][a-z0-9+.-]*\)$/\1/p')
            test "${#packages[@]}" -gt 0
            sudo apt install -y --no-install-recommends "${packages[@]}"
          fi
          pnpm exec playwright install-deps --dry-run chromium firefox webkit
          pnpm exec playwright install chromium firefox webkit

      - name: Verify all three browser engines
        run: pnpm test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krita-browser-evidence-${{ github.sha }}
          path: |
            build/logs/
            build/catalogs.json
            build/wasm-exceptions.json
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: krita-wasm-${{ github.sha }}
          path: dist/krita

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(
            dist/krita/krita.bundle.tar.gz
            dist/krita/krita.pages.tar.gz
            dist/krita/build.json
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/latest" \
            --jq '.[] | select(.ref == "refs/tags/latest") | .ref')
          if [[ -n "$ref" ]]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f "sha=$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/latest -f "sha=$GITHUB_SHA"
          fi
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest "${assets[@]}" --clobber
            gh release edit latest --prerelease --latest=false --draft=false \
              --title 'Nightly build' --notes "Built from $GITHUB_SHA."
          else
            gh release create latest "${assets[@]}" --verify-tag --prerelease --latest=false \
              --title 'Nightly build' --notes "Built from $GITHUB_SHA."
          fi
