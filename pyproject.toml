[tool.ruff]
target-version = "py312"
cache-dir = "build/ruff-cache"

[tool.ruff.lint]
extend-select = [ "I" ]

[tool.mypy]
python_version = "3.12"
files = [
  "scripts",
  "tests"
]
strict = true
cache_dir = "build/mypy-cache"

[[tool.mypy.overrides]]
module = "pyseccomp"
follow_untyped_imports = true
